; DIANA for M5Stack Cardputer ADV (D-I-0336-7 // Cardputer Edition)
;
;   pio run                 -> builds .pio/build/cardputer-adv/firmware.bin
;   pio run -t upload       -> flash over USB-C
;   python tools/package_sd.py -> copies firmware into sdcard/Diana.bin for M5Launcher
;
; Target: ESP32-S3FN8 (StampS3A) - 8MB flash, NO PSRAM.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.13.0   ; Arduino core 2.0.17; unpinned resolves to pioarduino core 3.x and breaks
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions/diana_8mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DDIANA_VERSION='"1.0.0"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    -Os

lib_deps =
    m5stack/M5Unified @ ^0.2.22
    m5stack/M5GFX @ ^0.2.29
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    bblanchon/ArduinoJson @ ^7.3.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

lib_ldf_mode = chain+
